<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#172033">
    <title>Bağlantı yok — Lemon</title>
    <style>
        /*
         * Bu sayfa Vite çıktısına bağımlı DEĞİLDİR — service worker ağ
         * tamamen başarısız olduğunda bunu servis eder, bu yüzden kendi
         * kendine yeten sade CSS taşır (layouts/print ile AYNI ilke,
         * CLAUDE.md §8/Ledger).
         */
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #F7F7F5;
            color: #1F2937;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            text-align: center;
        }
        .card { max-width: 22rem; }
        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: #C8A96B;
            color: #1F2937;
            font-weight: 700;
            font-size: 20px;
            margin-bottom: 16px;
        }
        h1 { font-size: 17px; font-weight: 500; margin: 0 0 8px; }
        p { font-size: 14px; color: #6B7280; margin: 0 0 20px; line-height: 1.5; }
        button {
            min-height: 44px;
            padding: 0 20px;
            border-radius: 8px;
            border: 1px solid #8A8A85;
            background: #FFFFFF;
            color: #1F2937;
            font-size: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge" aria-hidden="true">L</div>
        <h1>Bağlantı yok</h1>
        <p>
            Lemon'a şu anda erişilemiyor. İnternet bağlantınızı kontrol edip
            tekrar deneyin. Çevrimdışı veri girişi desteklenmez — kayıtlarınız
            yalnızca bağlantı geri geldiğinde güvenle işlenir.
        </p>
        <button type="button" onclick="location.reload()">Tekrar dene</button>
    </div>
</body>
</html>
