name: Personnel Android
on:
  push:
    paths: ['android/personnel-scanner/**', '.github/workflows/personnel-android.yml']
  pull_request:
    paths: ['android/personnel-scanner/**', '.github/workflows/personnel-android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: UID adapter tests
        working-directory: android/personnel-scanner
        run: |
          mkdir -p build/uid-test
          javac -d build/uid-test app/src/main/java/com/lemon/personnel/CardIdentifier.java tests/CardIdentifierTest.java
          java -cp build/uid-test CardIdentifierTest
      - name: Build and lint companion
        working-directory: android/personnel-scanner
        run: gradle --no-daemon assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: lemon-personnel-scanner-debug
          path: android/personnel-scanner/app/build/outputs/apk/debug/*.apk
          retention-days: 14
